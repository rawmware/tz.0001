<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RawmWare.OS Webcam Viewer</title>
  <style>
    body {
      font-family: 'MS Sans Serif', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #008080; /* Classic Windows 3.x teal background */
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    
    .window {
      background-color: #c0c0c0; /* Classic Windows 3.x gray */
      border: 2px outset #ffffff;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      min-width: 320px;
      min-height: 240px;
      position: relative;
      resize: both;
      overflow: hidden;
    }
    
    .title-bar {
      background: linear-gradient(90deg, #645d72, #52434e); /* Classic Windows 3.x blue gradient */
      color: white;
      padding: 2px 4px;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 18px;
      user-select: none;
      cursor: move;
    }
    
    .title-bar-text {
      margin-left: 4px;
    }
    
    .title-bar-controls {
      display: flex;
    }
    
    .title-bar-button {
      background-color: #c0c0c0;
      border: 1px outset #ffffff;
      width: 14px;
      height: 14px;
      margin-left: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      cursor: pointer;
    }
    
    .content {
      padding: 4px;
      height: calc(100% - 26px);
      display: flex;
      flex-direction: column;
    }
    
    .webcam-container {
      flex: 1;
      background-color: #000000;
      overflow: hidden;
    }
    
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .status-bar {
      height: 18px;
      border-top: 1px solid #808080;
      background-color: #c0c0c0;
      display: flex;
      align-items: center;
      padding: 0 4px;
      font-size: 12px;
      justify-content: space-between;
    }
    
    .retry-button {
      background-color: #c0c0c0;
      border: 2px outset #ffffff;
      font-size: 11px;
      padding: 0 8px;
      height: 14px;
      cursor: pointer;
      display: none; /* Hidden by default */
      align-items: center;
    }
    
    .camera-selector {
      display: none;
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      background-color: #c0c0c0;
      border-top: 1px solid #808080;
      padding: 4px;
      font-size: 11px;
    }
    
    .camera-dropdown {
      width: 100%;
      font-family: 'MS Sans Serif', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 11px;
      margin-top: 2px;
    }
    
    .camera-label {
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar" id="title-bar">
      <div class="title-bar-text">RawmWare.OS</div>
      <div class="title-bar-controls">
        <div class="title-bar-button">_</div>
        <div class="title-bar-button">□</div>
        <div class="title-bar-button" id="close-button">×</div>
      </div>
    </div>
    <div class="content">
      <div class="webcam-container">
        <video id="webcam" autoplay playsinline></video>
      </div>
      <div class="status-bar">
        <span>Ready</span>
        <div class="retry-button" id="retry-button">Retry</div>
      </div>
      <div class="camera-selector" id="camera-selector">
        <label class="camera-label">Select Camera:</label>
        <select class="camera-dropdown" id="camera-dropdown"></select>
      </div>
    </div>
  </div>
  
  <div style="margin-top: 10px; background-color: #ffffcc; border: 1px solid #e6e600; padding: 8px; max-width: 320px; font-size: 12px;">
    <strong>Note:</strong> Webcam access requires a secure context (HTTPS) in most browsers. If you're running this locally, try:
    <ul style="margin: 5px 0 0 20px; padding: 0;">
      <li>Chrome: Launch with <code>--allow-file-access-from-files</code> flag</li>
      <li>Edge: Allow local file access in settings</li>
      <li>Or use a local server instead of file:// protocol</li>
    </ul>
  </div>
  
  <script>
    // Make the window draggable
    const titleBar = document.getElementById('title-bar');
    const windowElement = titleBar.parentElement;
    let isDragging = false;
    let offsetX, offsetY;

    titleBar.addEventListener('mousedown', function(e) {
      isDragging = true;
      offsetX = e.clientX - windowElement.getBoundingClientRect().left;
      offsetY = e.clientY - windowElement.getBoundingClientRect().top;
    });

    document.addEventListener('mousemove', function(e) {
      if (isDragging) {
        windowElement.style.left = (e.clientX - offsetX) + 'px';
        windowElement.style.top = (e.clientY - offsetY) + 'px';
        windowElement.style.position = 'absolute';
      }
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
    });

    // Close button functionality
    document.getElementById('close-button').addEventListener('click', function() {
      if (confirm('Close RawmWare.OS Webcam Viewer?')) {
        windowElement.style.display = 'none';
      }
    });

    // Helper function to create a delay
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    // Access webcam
    async function setupWebcam(attemptNumber = 1, deviceId = null) {
      // Fix for accidentally passing an Event object
      if (attemptNumber && typeof attemptNumber === 'object' && attemptNumber.type) {
        console.warn('Event object incorrectly passed to setupWebcam. Using default attemptNumber=1');
        attemptNumber = 1;
      }
      
      const statusBar = document.querySelector('.status-bar span');
      const retryButton = document.getElementById('retry-button');
      const cameraSelector = document.getElementById('camera-selector');
      const video = document.getElementById('webcam');
      
      // Hide controls when starting
      retryButton.style.display = 'none';
      cameraSelector.style.display = 'none';
      
      try {
        statusBar.textContent = 'Requesting webcam access...';
        
        // Only list camera devices once at the beginning, not every time
        if (attemptNumber === 1 && !deviceId) {
          await listCameraDevices();
        }
        
        let constraints;
        
        // If a specific deviceId is provided, use it
        if (deviceId) {
          constraints = {
            video: { deviceId: { exact: deviceId } },
            audio: false
          };
        }
        // Otherwise try different constraints based on attempt number
        else if (attemptNumber === 1) {
          // First attempt - use ideal constraints
          constraints = { 
            video: {
              width: { ideal: 640 },
              height: { ideal: 480 },
              facingMode: "user"
            },
            audio: false
          };
        } else if (attemptNumber === 2) {
          // Second attempt - use simplified constraints
          constraints = { 
            video: true,
            audio: false
          };
        } else {
          // Third attempt - try with specific frame rate and lowest resolution
          constraints = { 
            video: {
              width: { exact: 320 },
              height: { exact: 240 },
              frameRate: { max: 15 }
            },
            audio: false
          };
        }
        
        console.log(`Attempt ${attemptNumber} with constraints:`, constraints);
        
        // If we had a previous stream, stop all tracks before getting a new one
        if (video.srcObject) {
          const tracks = video.srcObject.getTracks();
          tracks.forEach(track => {
            track.stop();
            console.log('Stopped track:', track.kind, track.label);
          });
          video.srcObject = null;
          
          // Add a small delay to make sure resources are freed
          await delay(300);
        }
        
        // Attempt to get webcam access with current constraints
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        
        // Assign the stream to the video element
        video.srcObject = stream;
        console.log('Stream assigned with tracks:', stream.getTracks().length);
        
        // Update status when video is ready
        video.onloadedmetadata = function() {
          statusBar.textContent = 'Webcam active - ' + video.videoWidth + 'x' + video.videoHeight;
        };
        
        // Handle potential play errors
        video.onplay = function() {
          statusBar.textContent = 'Webcam streaming';
        };
        
        video.onerror = function() {
          statusBar.textContent = 'Error: Video playback issue';
          console.error('Video element error:', video.error);
          showRetryButton();
        };
        
      } catch (error) {
        console.error(`Error accessing webcam (attempt ${attemptNumber}):`, error);
        
        // Try next fallback if we have NotReadableError and haven't exhausted all attempts
        if (error.name === 'NotReadableError' && attemptNumber < 3 && !deviceId) {
          statusBar.textContent = `Webcam busy, trying alternative method (${attemptNumber+1}/3)...`;
          // Add a longer delay before next attempt
          setTimeout(() => setupWebcam(attemptNumber + 1), 1500);
          return;
        }
        
        // Provide more specific error messages
        if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
          statusBar.textContent = 'Error: No webcam found on this device';
        } else if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
          statusBar.textContent = 'Error: Webcam permission denied';
        } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
          statusBar.textContent = 'Error: Webcam already in use or hardware issue';
          showCameraSelector(); // Show device selector on this specific error
        } else if (error.name === 'OverconstrainedError' || error.name === 'ConstraintNotSatisfiedError') {
          statusBar.textContent = 'Error: Webcam cannot satisfy constraints';
        } else if (error.name === 'TypeError') {
          statusBar.textContent = 'Error: HTTPS required for webcam access';
        } else {
          statusBar.textContent = 'Error: ' + error.message;
        }
        
        // Show retry button after errors
        showRetryButton();
      }
    }
    
    async function listCameraDevices() {
      try {
        let devices;
        try {
          // First try to get devices without requesting permission
          devices = await navigator.mediaDevices.enumerateDevices();
          
          // If we have labels already, we don't need to request permission again
          const hasLabels = devices.some(device => 
            device.kind === 'videoinput' && device.label !== '');
          
          if (!hasLabels) {
            // We need permission to see labels - request temporarily
            const tempStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
            // Get devices again, now with labels
            devices = await navigator.mediaDevices.enumerateDevices();
            // Stop the temporary stream
            tempStream.getTracks().forEach(track => track.stop());
          }
        } catch (e) {
          console.log("Could not enumerate devices:", e);
          return false;
        }
        
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        const dropdown = document.getElementById('camera-dropdown');
        
        // Clear existing options
        dropdown.innerHTML = '';
        
        // Add options for each video device
        if (videoDevices.length > 1) {
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Camera ${index + 1}`;
            dropdown.appendChild(option);
          });
          
          // Show the camera selector if multiple cameras
          showCameraSelector();
          return true;
        } else if (videoDevices.length === 1) {
          const option = document.createElement('option');
          option.value = videoDevices[0].deviceId;
          option.text = videoDevices[0].label || 'Default Camera';
          dropdown.appendChild(option);
        } else {
          const option = document.createElement('option');
          option.value = '';
          option.text = 'No cameras found';
          dropdown.appendChild(option);
        }
        
        return false;
      } catch (error) {
        console.error('Error listing camera devices:', error);
        return false;
      }
    }
    
    function showRetryButton() {
      const retryButton = document.getElementById('retry-button');
      retryButton.style.display = 'flex';
    }
    
    function showCameraSelector() {
      const cameraSelector = document.getElementById('camera-selector');
      cameraSelector.style.display = 'block';
    }

    // Event handling for buttons and initialization
    function initializeEventListeners() {
      // Initialize webcam when the page loads (not passing the load event)
      setupWebcam(1);
      
      // Add event listener for retry button
      document.getElementById('retry-button').addEventListener('click', function(e) {
        e.preventDefault(); // Prevent event from propagating
        setupWebcam(1); // Start from first attempt again
      });
      
      // Add event listener for camera dropdown
      document.getElementById('camera-dropdown').addEventListener('change', function(e) {
        const selectedDeviceId = this.value;
        if (selectedDeviceId) {
          setupWebcam(1, selectedDeviceId);
        }
      });
    }
    
    // Wait for page to fully load, then initialize (important for IE compatibility)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeEventListeners);
    } else {
      initializeEventListeners();
    }
  </script>
</body>
</html>
