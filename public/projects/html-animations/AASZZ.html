<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Code Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Changed back to black */
            color: #FFFFFF; /* Changed back to white */
            font-family: 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 0;
        }


        .code-window {
            position: relative;
            width: 45vw;
            max-width: 800px;
            height: 80vh;
            max-height: 900px;
            background-color: rgba(0, 0, 0, 0.95); /* Black background */
            border-width: 4px;
            border-style: solid;
            border-color: #FFFFFF; /* White border */
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: none; /* Removed animation */
        }
       
        /* Positioning for the windows - optimized for desktop */
        .window-left {
            margin-top: 0;
            transform: translateY(-100px);
        }
       
        .window-right {
            margin-top: 0;
            transform: translateY(100px);
        }


        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            background-color: #000000; /* Black background */
            border-bottom: 2px solid #FFFFFF; /* White border */
            animation: none; /* Removed animation */
        }


        .window-title {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9em;
            font-weight: bold;
            color: #FFFFFF; /* White text */
            animation: none; /* Removed animation */
        }


        .window-buttons {
            display: flex;
            gap: 5px;
        }


        .window-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #FFFFFF; /* White border */
            animation: none; /* Removed animation */
        }


        .code-content {
            flex: 1;
            overflow: hidden;
            white-space: pre;
            font-family: 'Courier New', monospace;
            color: #FFFFFF; /* White text */
            font-weight: 600; /* Reduced from 900 */
            font-size: 12px; /* Reduced from 16px */
            line-height: 1.2;
            padding: 8px; /* Reduced from 15px */
            background-color: #000000; /* Black background */
            animation: none;
        }


        .toolbar {
            height: 25px;
            background-color: #000000; /* Black background */
            border-top: 2px solid #FFFFFF; /* White border */
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 10px;
            animation: none; /* Removed animation */
        }


        .toolbar-item {
            margin-right: 15px;
            cursor: pointer;
            color: #FFFFFF; /* White text */
            animation: none; /* Removed animation */
        }


        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #FFFFFF; /* White cursor */
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }


        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }


        /* Update the mobile layout to stack windows vertically and make them look better */
        @media (max-width: 900px) {
            body {
                flex-direction: column; /* Stack windows vertically */
                justify-content: center;
                align-items: center;
                gap: 30px; /* Space between windows */
                padding: 20px;
                height: auto; /* Allow scrolling if needed */
                min-height: 100vh;
            }
           
            .code-window {
                width: 90vw; /* Almost full width */
                height: 40vh; /* Shorter height */
                max-width: none; /* Override desktop max-width */
                margin: 0; /* Remove margins */
                transform: none !important; /* Remove all transforms */
            }
           
            .window-left, .window-right {
                transform: none !important; /* Override any transforms */
                margin: 0;
            }
           
            /* Remove the small screen override that was causing problems */
            @media (max-width: 600px) {
                body {
                    flex-direction: column;
                    gap: 30px;
                }
               
                .code-window {
                    width: 90vw;
                    height: 40vh;
                    transform: none !important;
                }
            }
        }
    </style>
